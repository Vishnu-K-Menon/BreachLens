# Professional services claim, layout B (values below labels). ADR-007.
doc_type: HEALTH_CLAIM
layout: B
keywords:
  - {text: "PROFESSIONAL SERVICES CLAIM", weight: 3}
  - {text: "SUBSCRIBER NAME", weight: 2}
  - {text: "PROVIDER TIN", weight: 1}
  - {text: "DX CODES", weight: 1}
doc_date: {field: date_of_service}
document:
  insurer_name: {label_regex: '^PLAN$', direction: below}
persons:
  PATIENT:
    name_order: FIRST_LAST
    fields:
      raw_name: {label: "PATIENT NAME", direction: below}
      dob: {label: "PATIENT DOB", direction: below, charset: digits, pattern: '\d{2}/\d{2}/\d{2}',
            parse: date, formats: ["%m/%d/%y"]}
      raw_address: {label: "PATIENT ADDRESS", direction: below, lines: 2}
      relationship: {label: "RELATIONSHIP", direction: below}
      _raw_diagnosis: {label: "DX CODES", direction: below, findall: true, shape: "L*",
                       pattern: '^[A-Z]\d{2}(\.\d{1,4})?$'}
      date_of_service: {label: "SERVICE DATE", direction: below, charset: digits,
                        pattern: '\d{2}/\d{2}/\d{4}', parse: date, formats: ["%m/%d/%Y"]}
      _raw_procedure: {label: "CPT", direction: below, charset: digits, pattern: '\d{5}'}
  INSURED:
    name_order: FIRST_LAST
    merge_into_if_absent: PATIENT
    fields:
      raw_name: {label: "SUBSCRIBER NAME", direction: below}
      raw_address: {label: "SUBSCRIBER ADDRESS", direction: below, lines: 2}
      _raw_member_id: {label: "MEMBER ID", direction: below, shape: LLLDDDDDDDDD, pattern: '[A-Z]{3}\d{9}'}
      _raw_group_number: {label: "GROUP #", direction: below, charset: digits, pattern: '\d{6}'}
identifiers:
  - {kind: NPI, label: "PROVIDER NPI", direction: below, charset: digits, pattern: '\d{10}'}
  - {kind: PROVIDER_TIN, label: "PROVIDER TIN", direction: below, charset: digits, pattern: '\d{2}-\d{7}'}
boundaries: ["BILLING PROVIDER"]
