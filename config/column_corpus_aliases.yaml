# Header alias pool for the synthetic column-classifier corpus (ML_MODELS.md §C).
# Each alias is one "alias group": GroupKFold splits by group, so test headers are
# aliases the model never saw. This pool is separate from config/header_aliases.yaml
# (the M3 rules baseline) on purpose.
FULL_NAME: [Full Name, Name, Customer Name, Patient Name, Employee Name, Member Name, Insured Name]
FIRST_NAME: [First Name, First, Given Name, FName, Forename, First Nm]
MIDDLE_NAME: [Middle Name, Middle, MI, Middle Initial, M Name]
LAST_NAME: [Last Name, Last, Surname, LName, Family Name, Last Nm]
SUFFIX: [Suffix, Name Suffix, Sfx, Generation]
ADDRESS_FULL: [Full Address, Mailing Address, Address Block, Home Address Full]
ADDRESS_LINE1: [Address, Street, Address Line 1, Addr1, Street Address, Home Street]
ADDRESS_LINE2: [Address Line 2, Addr2, Apt/Unit, Suite, Unit]
CITY: [City, Town, Municipality, City Name, Home City]
STATE: [State, ST, State Code, Province, Home State]
ZIP: [ZIP, Zip Code, Postal Code, ZIP5, Zipcode, Post Code]
CITY_STATE_ZIP: [City/State/Zip, City State Zip, CSZ, Locality]
PHONE: [Phone, Phone Number, Telephone, Mobile, Cell, Contact No, Home Phone]
EMAIL: [Email, E-mail, Email Address, Mail, Contact Email]
DOB: [DOB, Date of Birth, Birth Date, Birthdate, BDay, Born]
