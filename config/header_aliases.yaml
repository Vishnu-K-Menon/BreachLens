# Header-alias rules: the column-mapping BASELINE (SPREADSHEET_TRACK.md §4, ML_MODELS.md
# "Baseline R"). A header is normalized (lowercase, punctuation and underscores to spaces)
# and matched against `exact` aliases first, then `contains` keywords in label order.
# Deliberately header-only: it cannot recover "ID" or "Column7" (that is the ML's job).
exact:
  FULL_NAME: [name, full name, customer, customer name, patient name, employee name, member name, student name]
  FIRST_NAME: [first, first name, fname, given name]
  MIDDLE_NAME: [middle, middle name, mi]
  LAST_NAME: [last, last name, lname, surname]
  SUFFIX: [suffix, sfx]
  ADDRESS_FULL: [full address, mailing address]
  ADDRESS_LINE1: [address, street, address line 1, addr1, street address]
  ADDRESS_LINE2: [address line 2, addr2, apt, unit, suite]
  CITY: [city, town]
  STATE: [state, st]
  ZIP: [zip, zip code, zipcode, postal code]
  CITY_STATE_ZIP: [city state zip, city/state/zip]
  PHONE: [phone, phone number, telephone, mobile, cell]
  EMAIL: [email, e mail, email address]
  DOB: [dob, date of birth, birth date, birthdate]
  SSN: [ssn, ss, ss#, social, social security, social security number, soc sec]
  DL_NUMBER: [dl, dl number, drivers license, driver license, license number]
  DL_STATE: [dl state, license state]
  PASSPORT: [passport, passport number]
  BANK_ACCOUNT: [account, account number, account no, bank account]
  ROUTING: [routing, routing number, aba, bank routing]
  CARD: [card, card number, credit card, cc number]
  MRN: [mrn, medical record number]
  MEMBER_ID: [member id, subscriber id, policy number]
  GROUP_NUMBER: [group, group number, group no, group id]
  DIAGNOSIS: [diagnosis, dx]
  STUDENT_ID: [student id, student number]
  SCHOOL: [school, school name]
  GUARDIAN_NAME: [guardian, guardian name, parent name]
  EMPLOYEE_ID: [employee id, emp id, emp no, staff id]
  ORG_NAME: [company, employer, organization, vendor, insurer]
  EIN: [ein, fein, employer id]
  FREE_TEXT: [notes, comments, remarks, memo]
contains:   # keyword -> label, checked in this order when no exact alias matches
  - [ssn, SSN]
  - [social, SSN]
  - [birth, DOB]
  - [dob, DOB]
  - [zip, ZIP]
  - [phone, PHONE]
  - [email, EMAIL]
  - [mrn, MRN]
  - [member, MEMBER_ID]
  - [routing, ROUTING]
  - [card, CARD]
  - [account, BANK_ACCOUNT]
  - [city, CITY]             # before address: merged headers read 'Home Address City'
  - [state, STATE]
  - [street, ADDRESS_LINE1]
  - [address, ADDRESS_LINE1]
  - [first, FIRST_NAME]
  - [last, LAST_NAME]
  - [middle, MIDDLE_NAME]
  - [suffix, SUFFIX]
  - [student, STUDENT_ID]
  - [school, SCHOOL]
  - [guardian, GUARDIAN_NAME]
  - [employee id, EMPLOYEE_ID]
  - [note, FREE_TEXT]
  - [comment, FREE_TEXT]
