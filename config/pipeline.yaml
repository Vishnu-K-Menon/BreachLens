# BreachLens pipeline configuration, validated by breachlens.config.PipelineConfig.
# Unknown keys are rejected. Relative paths resolve against the project root
# (the parent of this config/ directory). Secrets live in .env, never here.

# Fixed "as of" date for ages, minor status, DOB plausibility, the 2-digit-year pivot,
# the generator and the workbook RunDate (ADR-053). Results do not drift over time.
as_of_date: 2026-10-01

# true = no network calls except the local Ollama endpoint (on-prem mode).
offline: true
seed: 42

paths:
  input_dir: data/raw/corpus_v1/docs
  output_dir: data/output
  cache_dir: data/cache
  reference_dir: data/reference
  models_dir: models          # trained column classifier (breachlens train column-classifier)

# PDF track (M2). Scans are deskewed, binarized (removes the light-gray watermark) and
# OCR'd with Tesseract (TESSERACT_CMD in .env). psm 11 = sparse text: keeps large titles and
# scattered form fields; the extractor rebuilds lines from word boxes.
ocr:
  dpi: 300
  lang: eng
  psm: 11
  binarize_threshold: 160
  remove_lines_min_px: 80   # erase form box borders (dark runs >= 80 px) before OCR
  min_conf: 0.30            # drop OCR words below this confidence (border remnants, noise)
  min_height_pt: 3.0        # drop flat OCR words (remnants of erased box borders)
text_layer:
  max_font_size: 30   # the 54 pt watermark glyphs are dropped
doctype:
  min_score: 0.5      # keyword score below this -> UNKNOWN (DOC_TYPE_UNKNOWN)

stages:
  pdf_track: true
  sheet_track: true
  normalize: true
  validation: true
  address: true
  privacy: true
  resolve: true
  notify: true
  database: true
  workbook: true
