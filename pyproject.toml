[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "breachlens"
version = "0.1.0"
description = "Privacy-safe breach-data preparation pipeline (PDF/scan + Excel/CSV) on synthetic data."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Vishnu K Menon" }]
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "faker>=24.0",
    "reportlab>=4.1",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "pillow>=10.2",
    "nameparser>=1.1",
    "usaddress>=0.5.10",
    "zipcodes>=1.2",
    "rapidfuzz>=3.6",
    "jellyfish>=1.0",
    "phonenumbers>=8.13",
    "requests>=2.31",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    "python-calamine>=0.2",
    "xlrd>=2.0",
    "charset-normalizer>=3.3",
    "duckdb>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
ocr = ["pytesseract>=0.3.10"]
ml = ["scikit-learn>=1.4", "joblib>=1.3", "matplotlib>=3.8"]
ask = ["sqlglot>=25.0"]
anthropic = ["anthropic>=0.40"]

[project.scripts]
breachlens = "breachlens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/breachlens"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Python files only: ruff would otherwise reformat code blocks inside the Markdown docs.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "network: needs internet access (opt in with BREACHLENS_TEST_NETWORK=1)",
    "libreoffice: needs LibreOffice (soffice on PATH or SOFFICE_PATH)",
    "ollama: needs a running Ollama server (OLLAMA_HOST)",
    "tesseract: needs Tesseract OCR (on PATH or TESSERACT_CMD)",
]
